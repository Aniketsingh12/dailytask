<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fustat:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#0084FF;
    --brand-2:#319AFF;
    --brand-3:#60B1FF;
    --ink:#0B1020;
    --ink-2:rgba(11,16,32,0.60);
    --ink-3:rgba(11,16,32,0.42);
    --glass:rgba(255,255,255,0.55);
    --glass-2:rgba(255,255,255,0.32);
    --stroke:rgba(0,0,0,0.10);
    --stroke-soft:rgba(0,0,0,0.06);
    --inner:inset 0 4px 4px 0 rgba(255,255,255,0.25);
    --inner-strong:inset 0 4px 4px 0 rgba(255,255,255,0.35);
    --orange:#FF801E;
    --violet:#8B5CF6;
    --teal:#00B8D9;
    --rose:#FF3B5C;
    --green:#12B76A;
    --r:18px;
    --r-sm:12px;
  }
  *{box-sizing:border-box}
  ::selection{background:var(--brand);color:#fff}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.14);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.24)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  html,body{overflow-x:hidden}
  body{
    margin:0;background:#fff;color:var(--ink);
    font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;
    -webkit-font-smoothing:antialiased;
  }
  .bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg-glow::before,.bg-glow::after{content:'';position:absolute;border-radius:50%;filter:blur(90px)}
  .bg-glow::before{width:620px;height:560px;top:-220px;left:-160px;background:rgba(96,177,255,0.55)}
  .bg-glow::after{width:520px;height:460px;top:-80px;left:220px;background:rgba(49,154,255,0.34)}

  h1,h2,h3,.brand,.stat-num,.hero-label{font-family:'Fustat',sans-serif}

  /* ---------- floating glass navbar ---------- */
  .navbar{
    position:sticky;top:20px;z-index:50;
    width:fit-content;max-width:calc(100% - 32px);margin:20px auto 0;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;
    padding:10px 12px 10px 20px;border-radius:16px;
    background:rgba(255,255,255,0.30);
    backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);
    border:1px solid rgba(0,0,0,0.10);
    box-shadow:var(--inner), 0 10px 34px rgba(11,16,32,0.08);
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap}
  .brand-mark{
    width:20px;height:20px;border-radius:6px;flex-shrink:0;
    background:linear-gradient(140deg,var(--brand),var(--brand-3));
    box-shadow:0 3px 10px rgba(0,132,255,0.4);
  }
  .nav-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

  /* ---------- buttons ---------- */
  button{
    font-family:'Inter',sans-serif;cursor:pointer;
    border:1px solid rgba(0,0,0,0.10);
    background:rgba(255,255,255,0.50);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    color:var(--ink);border-radius:12px;padding:9px 15px;
    font-size:13px;font-weight:500;white-space:nowrap;
    box-shadow:var(--inner);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  button:hover{transform:scale(1.02)}
  button:active{transform:scale(0.97)}
  button.primary{
    background:rgba(0,132,255,0.85);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    color:#fff;border-color:transparent;font-weight:600;
    box-shadow:var(--inner-strong), 0 8px 22px rgba(0,132,255,0.32);
  }
  button.primary:hover{box-shadow:var(--inner-strong), 0 10px 28px rgba(0,132,255,0.44)}
  button.on{color:#fff;border-color:transparent;font-weight:600}
  button.cal.on{background:rgba(0,184,217,0.88);box-shadow:var(--inner-strong), 0 8px 20px rgba(0,184,217,0.3)}
  button.eml.on{background:rgba(139,92,246,0.88);box-shadow:var(--inner-strong), 0 8px 20px rgba(139,92,246,0.3)}
  button#remindBtn.on{background:rgba(255,128,30,0.90);box-shadow:var(--inner-strong), 0 8px 20px rgba(255,128,30,0.3)}
  button:disabled{opacity:0.5;cursor:default;transform:none}

  /* ---------- layout ---------- */
  main{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:40px 24px 0}

  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;margin-bottom:30px}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:0.16em;text-transform:uppercase;color:var(--brand);
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .eyebrow::before{
    content:'';width:6px;height:6px;border-radius:50%;background:var(--brand);
    box-shadow:0 0 0 3px rgba(0,132,255,0.18);animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 3px rgba(0,132,255,0.18)}
    50%{box-shadow:0 0 0 7px rgba(0,132,255,0.04)}
  }
  h1{font-size:46px;line-height:1.05;letter-spacing:-0.03em;font-weight:700;margin:0}
  .lede{color:var(--ink-2);font-size:14.5px;letter-spacing:-0.01em;margin:12px 0 0;line-height:1.5}

  /* ---------- stats ---------- */
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{
    position:relative;overflow:hidden;

    background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--stroke);
    box-shadow:var(--inner), 0 6px 20px rgba(11,16,32,0.06);
  }
  .stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:var(--ink-3)}
  .stat-num{font-size:26px;font-weight:700;line-height:1;letter-spacing:-0.02em}
  .stat-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-3);font-weight:500}
  .s-critical .stat-num{color:var(--rose)} .s-critical::before{background:var(--rose)}
  .s-late .stat-num{color:var(--orange)}  .s-late::before{background:var(--orange)}
  .s-today .stat-num{color:var(--teal)}   .s-today::before{background:var(--teal)}
  .s-done .stat-num{color:var(--green)}   .s-done::before{background:var(--green)}
  .s-open .stat-num{color:var(--brand)}   .s-open::before{background:var(--brand)}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 296px;gap:24px;align-items:start}

  .section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 14px}
  .section-head h2{font-size:15px;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--ink-2)}

  .sort-toggle{
    display:flex;gap:3px;padding:4px;border-radius:14px;
    background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--stroke);
    box-shadow:var(--inner);
  }
  .sort-toggle button{padding:7px 14px;font-size:12px;border-color:transparent;background:transparent;box-shadow:none;border-radius:10px;color:var(--ink-3)}
  .sort-toggle button:hover{transform:none;color:var(--ink)}
  .sort-toggle button.active{color:#fff;background:rgba(0,132,255,0.88);box-shadow:var(--inner-strong);font-weight:600}

  /* ---------- cards ---------- */
  .card{
    background:var(--glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--stroke);border-radius:var(--r);
    box-shadow:var(--inner), 0 6px 20px rgba(11,16,32,0.055);
  }

  .hero-label{
    display:flex;align-items:center;gap:8px;
    font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;
    color:var(--brand);margin-bottom:10px;
  }
  .hero-label::before{content:'';width:16px;height:2px;border-radius:2px;background:var(--brand)}
  #mainTaskWrap{margin-bottom:30px}
  #mainTaskWrap:empty{margin-bottom:0}

  .task{
    position:relative;display:flex;gap:15px;align-items:flex-start;
    padding:17px 19px;margin-bottom:11px;
    border-left:3px solid var(--gc, var(--stroke));
    transition:transform .16s ease, box-shadow .16s ease, opacity .25s ease;
    animation:rise .28s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .task:hover{transform:translateY(-2px);box-shadow:var(--inner), 0 12px 30px rgba(11,16,32,0.10)}
  .task.is-done{opacity:0.48}
  .task.is-done .task-title{text-decoration:line-through}
  .task.is-late{border-color:rgba(255,59,92,0.35)}
  .task.is-critical{
    border-color:var(--rose);
    box-shadow:var(--inner), 0 0 0 1px rgba(255,59,92,0.25), 0 10px 28px rgba(255,59,92,0.14);
    animation:critPulse 2.2s ease-in-out infinite, rise .28s ease;
  }
  @keyframes critPulse{
    0%,100%{box-shadow:var(--inner), 0 0 0 1px rgba(255,59,92,0.25), 0 10px 28px rgba(255,59,92,0.14)}
    50%{box-shadow:var(--inner), 0 0 0 1px rgba(255,59,92,0.45), 0 12px 34px rgba(255,59,92,0.26)}
  }
  .task-hero{
    padding:26px 28px;border-left-width:4px;
    background:linear-gradient(135deg, rgba(0,132,255,0.09), rgba(255,255,255,0.55) 55%);

  }
  .task-hero .task-title{font-size:22px;font-weight:700;letter-spacing:-0.02em;font-family:'Fustat',sans-serif}
  .task-hero .check{width:28px;height:28px;border-radius:9px;font-size:15px}

  .task-body{flex:1;min-width:0}
  .task-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .task-title{font-size:15px;font-weight:500;line-height:1.4;margin:0;letter-spacing:-0.01em}

  .check{
    width:23px;height:23px;flex-shrink:0;margin-top:1px;padding:0;
    border-radius:8px;border:1.5px solid rgba(0,0,0,0.16);background:rgba(255,255,255,0.7);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;box-shadow:none;
  }
  .check:hover{border-color:var(--brand);transform:scale(1.09)}
  .is-done .check{background:var(--brand);border-color:transparent}

  .del{
    background:none;border:none;box-shadow:none;color:var(--ink-3);
    font-size:18px;line-height:1;padding:2px 6px;border-radius:8px;flex-shrink:0;
  }
  .del:hover{color:var(--rose);background:rgba(255,59,92,0.10);transform:none}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
  .chip{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.01em;
    padding:4px 10px;border-radius:20px;
    border:1px solid var(--stroke);background:rgba(255,255,255,0.6);color:var(--ink-3);
  }
  .chip-goal{color:var(--gc);border-color:var(--gc);background:color-mix(in srgb, var(--gc) 8%, transparent)}
  .chip-critical{color:#fff;background:var(--rose);border-color:transparent;font-weight:600}
  .chip-late{color:#c4213c;border-color:rgba(255,59,92,0.5);background:rgba(255,59,92,0.09)}
  .chip-today{color:#a35800;border-color:rgba(255,128,30,0.5);background:rgba(255,128,30,0.10)}
  .chip-daily{color:#0068cc;border-color:rgba(0,132,255,0.45);background:rgba(0,132,255,0.08)}
  .chip-cal{color:#00758c;border-color:rgba(0,184,217,0.5);background:rgba(0,184,217,0.09)}
  .chip-mail{color:#6d28d9;border-color:rgba(139,92,246,0.5);background:rgba(139,92,246,0.09)}
  .chip-due{display:inline-flex;align-items:center;gap:3px}
  .chip-due input{
    background:transparent;border:none;padding:0;width:96px;
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:inherit;cursor:pointer;
  }
  .is-late .chip-due{color:#c4213c}

  /* ---------- sidebar ---------- */
  .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:104px}

  .panel h3{font-size:14px;font-weight:700;margin:0 0 3px;letter-spacing:-0.01em}
  .panel-sub{font-size:11.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.45}

  .goal-row{padding:12px 0;border-bottom:1px solid var(--stroke-soft)}

  .goal-row:first-child{padding-top:0}
  .goal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .goal-name{
    font-size:13px;font-weight:600;letter-spacing:-0.01em;

    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .goal-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--gc);box-shadow:0 0 8px var(--gc)}
  .goal-count{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);flex-shrink:0;
    background:rgba(0,0,0,0.04);padding:2px 8px;border-radius:20px;border:1px solid var(--stroke-soft);
  }
  .imp-meter{height:4px;border-radius:4px;background:rgba(0,0,0,0.07);overflow:hidden}
  .imp-fill{height:100%;border-radius:4px;background:var(--gc);opacity:0.85}

  .status{font-size:11.5px;color:var(--ink-3);line-height:1.5;display:block}

  /* ---------- misc ---------- */

  .tray{
    display:none;align-items:center;gap:10px;flex-wrap:wrap;

    font-size:12.5px;color:var(--ink-2);
  }
  .tray.show{display:flex}
  input[type=time]{
    background:#fff;border:1px solid var(--stroke);color:var(--ink);
    border-radius:10px;padding:7px 10px;font-size:12.5px;font-family:'Inter',sans-serif;
  }
  input[type=time]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,132,255,0.12);outline:none}

  /* ---------- subtasks ---------- */
  .subs{margin-top:16px;padding-top:14px;border-top:1px solid var(--stroke-soft)}
  .subs-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .subs-head span:first-child{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--ink-3);font-weight:600;
  }
  .subs-count{font-family:'Fustat',sans-serif;font-size:13px;font-weight:700;color:var(--brand)}
  .subs-bar{height:4px;border-radius:4px;background:rgba(0,0,0,0.07);overflow:hidden;margin-bottom:12px}
  .subs-fill{height:100%;border-radius:4px;background:var(--brand);transition:width .3s ease}
  .sub-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .sub-item{
    display:flex;align-items:flex-start;gap:10px;cursor:pointer;
    padding:6px 8px;margin-left:-8px;border-radius:8px;
    font-size:13px;line-height:1.4;color:var(--ink-2);
    transition:background .15s ease, color .15s ease;
  }
  .sub-item:hover{background:rgba(0,132,255,0.06);color:var(--ink)}
  .sub-box{
    width:16px;height:16px;flex-shrink:0;margin-top:1px;border-radius:5px;
    border:1.5px solid rgba(0,0,0,0.18);background:#fff;
    display:grid;place-items:center;font-size:10px;color:#fff;

  .sub-done{color:var(--ink-3)}
  .sub-done .sub-text{text-decoration:line-through}
  .sub-done .sub-box{background:var(--brand);border-color:transparent}

  /* ---------- tiers & accountability ---------- */
  .chip-tier{text-transform:uppercase;letter-spacing:0.08em;font-size:9.5px;font-weight:600}
  .tier-core .chip-tier{color:#c4213c;border-color:rgba(255,59,92,0.45);background:rgba(255,59,92,0.08)}
  .tier-important .chip-tier{color:#a35800;border-color:rgba(255,128,30,0.45);background:rgba(255,128,30,0.08)}
  .tier-regular .chip-tier{color:var(--ink-3)}
  .chip-slip{color:#a35800;border-color:rgba(255,128,30,0.4);background:rgba(255,128,30,0.07)}

  /* core tasks carry a heavier left rail so they read as non-negotiable */
  .task.tier-core{border-left-width:4px}
  .task.tier-regular{border-left-color:rgba(0,0,0,0.10)}

  .stakes{
    margin-top:14px;padding:11px 14px;border-radius:10px;
    font-size:12.5px;line-height:1.5;color:var(--ink-2);
    background:rgba(0,132,255,0.07);border:1px solid rgba(0,132,255,0.16);
  }
  .stakes b{color:var(--ink);font-weight:700}
  .is-critical .stakes{background:rgba(255,59,92,0.08);border-color:rgba(255,59,92,0.22)}

  .accountability{background:linear-gradient(150deg, rgba(0,132,255,0.07), rgba(255,255,255,0.55) 60%)}
  .prog-wrap{display:flex;align-items:center;gap:15px;margin:14px 0 12px}
  .prog-ring{
    --pct:0;
    width:62px;height:62px;flex-shrink:0;border-radius:50%;
    background:conic-gradient(var(--brand) calc(var(--pct) * 1%), rgba(0,0,0,0.07) 0);
    display:grid;place-items:center;position:relative;

  .prog-ring::after{
    content:attr(data-pct);
    width:46px;height:46px;border-radius:50%;background:#fff;

  .prog-text{font-size:12.5px;color:var(--ink-2);margin:0 0 6px;line-height:1.4}
  .mini-stats{display:flex;gap:14px;flex-wrap:wrap}
  .mini-stats span{font-size:11px;color:var(--ink-3)}
  .mini-stats b{font-family:'Fustat',sans-serif;font-size:15px;color:var(--ink);margin-right:3px}

  .verdict{
    font-size:12.5px;line-height:1.5;margin:0;padding:11px 13px;border-radius:10px;font-weight:500;
  }
  .verdict.good{color:#0f7a4a;background:rgba(18,183,106,0.09);border:1px solid rgba(18,183,106,0.2)}
  .verdict.warn{color:#a35800;background:rgba(255,128,30,0.09);border:1px solid rgba(255,128,30,0.22)}
  .verdict.bad{color:#c4213c;background:rgba(255,59,92,0.09);border:1px solid rgba(255,59,92,0.24)}

  /* ---------- responsive ---------- */
  @media(max-width:900px){
    h1{font-size:38px}
  }
  @media(max-width:640px){
    .navbar{width:auto;margin:12px 14px 0;top:12px;padding:10px 12px;gap:12px;justify-content:space-between}
    .brand{font-size:15px}
    .nav-actions{gap:6px}
    .nav-actions button{padding:8px 11px;font-size:12px}
    main{padding:28px 16px 0}
    h1{font-size:30px}
    .lede{font-size:13.5px}
    .hero{margin-bottom:24px;gap:20px}
    .stats{gap:8px;width:100%}
    .stat{flex:1;min-width:calc(33.333% - 6px);padding:12px 13px}
    .stat-num{font-size:21px}
    .section-head{margin-bottom:12px}
    .sort-toggle{width:100%}
    .sort-toggle button{flex:1;text-align:center;padding:7px 8px}
    .task{padding:14px;gap:12px}
    .task-hero{padding:18px 17px}
    .task-hero .task-title{font-size:18px}
    #mainTaskWrap{margin-bottom:24px}
    .panel{padding:16px}
  }
  @media(max-width:380px){
    h1{font-size:26px}
    .nav-actions button{padding:7px 9px;font-size:11px}
    .stat{min-width:calc(50% - 4px)}
  }
</style>
</head>

function loadState(){
  let storedVersion = 1;
  try{
    const raw = localStorage.getItem('signal-deck-data');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.goals && parsed.todos) state = {...state, ...parsed};
      storedVersion = parsed.dataVersion || 1;
    } else {
      storedVersion = DATA_VERSION; // fresh install already has the latest defaults
    }
  }catch(e){ /* no saved data yet, use defaults */ }

  let migrated = false;
  for(let v = storedVersion + 1; v <= DATA_VERSION; v++){
    if(MIGRATIONS[v]){ MIGRATIONS[v](state); migrated = true; }
  }
  state.dataVersion = DATA_VERSION;

  // Away for a few days? Start from today rather than 3 weeks in the hole.
  if(state.lastOpened && daysBetween(todayStr(), state.lastOpened) >= ABSENCE_GRACE_DAYS){
    rebaseDailies(state);
    migrated = true;
  }
  state.lastOpened = todayStr();
  trySave();

  render();
  return Promise.resolve();
}

function goalColor(goalId){
  const idx = state.goals.findIndex(g=>g.id===goalId);
  return GOAL_COLORS[idx % GOAL_COLORS.length] || '#666';
}
function goalById(id){ return state.goals.find(g=>g.id===id); }

// ---- Task tiers ----
// Not everything deserves the same panic threshold. Reading slipping 3 days is
// fine; freelance profiles slipping 3 days is not. Tier is derived from the
// goal's weight, so it stays automatic — no extra tagging per task.
//   core      (goal 5/5) -> critical after 2 days, hardest urgency jump
//   important (goal 4/5) -> critical after 4 days
//   regular   (goal <=3) -> critical after 7 days, gentle climb
const TIERS = {
  core:      {key:'core',      label:'core',      days:2, bump:0.95},
  important: {key:'important', label:'important', days:4, bump:0.55},
  regular:   {key:'regular',   label:'regular',   days:7, bump:0.22}
};

function tierOf(t){
  const g = goalById(t.goalId);
  const imp = g ? g.importance : 3;
  if(imp >= 5) return TIERS.core;
  if(imp >= 4) return TIERS.important;
  return TIERS.regular;
}

function urgencyFromDue(t){
  const due = t.due;
  if(!due) return 0.15;
  const days = (new Date(due) - new Date()) / 86400000;
  if(days < 0){
    // Overdue urgency keeps climbing the longer it's late, then takes an extra
    // jump once it crosses this task's own tier threshold.
    const tier = tierOf(t);
    const daysLate = Math.abs(days);
    let urg = 1 + Math.min(daysLate, 20) * 0.06;
    if(daysLate >= tier.days) urg += tier.bump;
    return urg;
  }
  if(days <= 1) return 0.95;
  if(days <= 3) return 0.75;
  if(days <= 7) return 0.5;
  if(days <= 14) return 0.3;
  return 0.15;
}

function isCritical(t){
  const limit = tierOf(t).days;
  if(t.daily) return dailyMissedStreak(t) >= limit;
  return t.due && isOverdue(t.due) && Math.abs((new Date(t.due) - new Date())/86400000) >= limit;
}

// "Slipping" = behind, but not yet at this task's critical line.
function isSlipping(t){
  if(isCritical(t)) return false;
  const behind = t.daily ? dailyMissedStreak(t) : (t.due && isOverdue(t.due) ? Math.abs((new Date(t.due)-new Date())/86400000) : 0);
  return behind > 0;
}

function isOverdue(due){
  if(!due) return false;
  return (new Date(due) - new Date(new Date().toDateString())) < 0;
}
function isDueToday(due){
  if(!due) return false;
  return new Date(due).toDateString() === new Date().toDateString();
}

// ---- Daily recurring tasks ----
// No fixed due date. Completion is tracked via lastDoneDate ("did you do it today?").
// If it's not done for a day, that day counts toward a missed streak, and the
// task's urgency climbs the longer it goes undone — same idea as overdue escalation,
// just anchored to "today" instead of a calendar date.
function todayStr(){ return new Date().toDateString(); }

function isDoneToday(t){
  return t.daily && t.lastDoneDate === todayStr();
}

function dailyDaysSince(t){
  const ref = t.lastDoneDate || t.createdDate;
  if(!ref) return 0;
  const today = new Date(todayStr());
  const refDate = new Date(new Date(ref).toDateString());
  return Math.round((today - refDate) / 86400000);
}

// If Signal Deck goes unopened for a stretch, that gap shouldn't be billed as
// missed days — otherwise one holiday buries every task in permanent "critical"
// and the ranking stops meaning anything. Coming back rebases the clock to today.
// Streaks still reset honestly, because history[] is left untouched.
const ABSENCE_GRACE_DAYS = 3;

function rebaseDailies(st){
  st.todos.forEach(t=>{
    if(!t.daily) return;
    t.createdDate = todayStr();
    t.lastDoneDate = null;
  });
}

function daysBetween(a, b){
  return Math.round((new Date(new Date(a).toDateString()) - new Date(new Date(b).toDateString())) / 86400000);
}

function dailyMissedStreak(t){
  // 0 or 1 day since it was last done = still on track for today.
  // 2+ days = it's been skipped at least once.
  return Math.max(0, dailyDaysSince(t) - 1);
}

function urgencyForDaily(t){
  if(isDoneToday(t)) return 0.15;
  const tier = tierOf(t);
  const missed = dailyMissedStreak(t);
  let urg = 0.6 + Math.min(missed, 20) * 0.07;
  if(missed >= tier.days) urg += tier.bump;
  return urg;
}

// ---- Streaks & accountability ----
// Completion history per daily task powers streaks, which are the carrot;
// missed-day debt is the stick.
function markDailyDone(t){ t.lastDoneDate = todayStr(); }
function unmarkDailyDone(t){ t.lastDoneDate = null; }

function todayProgress(){
  const daily = state.todos.filter(t => t.daily);
  const done = daily.filter(t => isDoneToday(t)).length;
  return {done, total: daily.length, pct: daily.length ? Math.round(done / daily.length * 100) : 0};
}

function missedDebt(){
  return state.todos
    .filter(t => !isTodoDone(t) && t.daily)
    .reduce((sum, t) => sum + dailyMissedStreak(t), 0);
}

// Everything in the top ("core") tier counts as a main task. If nothing is
// core, the single highest-scoring task is promoted so there's always one focus.
// Big tasks carry a milestone checklist. Progress on it is what "doing the
// work" actually looks like day to day.
function subProgress(t){
  if(!Array.isArray(t.subtasks) || !t.subtasks.length) return null;
  const done = t.subtasks.filter(s => s.done).length;
  const next = (t.subtasks.find(s => !s.done) || {}).text || '';
  return {done, total: t.subtasks.length, next};
}

function mainTasksNow(){
  const open = state.todos.filter(t => !isTodoDone(t));
  if(!open.length) return [];
  const ranked = [...open].sort((a,b) => scoreOf(b) - scoreOf(a));
  const core = ranked.filter(t => tierOf(t).key === 'core');
  return core.length ? core.slice(0,3) : ranked.slice(0,1);
}

function mainTaskNow(){
  return mainTasksNow()[0] || null;
}

function isTodoDone(t){
  return t.daily ? isDoneToday(t) : !!t.done;
}

function urgencyOf(t){
  return t.daily ? urgencyForDaily(t) : urgencyFromDue(t);
}

function scoreOf(todo){
  const goal = goalById(todo.goalId);
  const gw = goal ? goal.importance/5 : 0.4;
  const urg = urgencyOf(todo);
  const cal = todo.cal ? 1 : 0;
  const eml = todo.email ? 1 : 0;
  return gw*40 + urg*35 + cal*15 + eml*10;
}

function renderGoals(){
  const list = document.getElementById('goalList');
  list.innerHTML = '';
  state.goals.forEach(g=>{
    const count = state.todos.filter(t=>t.goalId===g.id && !isTodoDone(t)).length;
    const row = document.createElement('div');
    row.className = 'goal-row';
    row.style.setProperty('--gc', goalColor(g.id));
    row.innerHTML = `
      <div class="goal-top">
        <span class="goal-name"><i class="goal-dot"></i>${g.name}</span>
        <span class="goal-count">${count}</span>
      </div>
      <div class="imp-meter"><div class="imp-fill" style="width:${g.importance*20}%"></div></div>
    `;
    list.appendChild(row);
  });
}

function fmtDue(due){
  if(!due) return null;
  const days = Math.ceil((new Date(due) - new Date(new Date().toDateString())) / 86400000);
  if(days < 0) return `${Math.abs(days)}d overdue`;
  if(days === 0) return 'today';
  if(days === 1) return 'tomorrow';
  return `in ${days}d`;
}

function buildTodoEl(t, featured){
  const goal = goalById(t.goalId);
  const dueLabel = t.daily ? null : fmtDue(t.due);
  const done = isTodoDone(t);
  const missed = t.daily ? dailyMissedStreak(t) : 0;
  const overdue = !done && !t.daily && isOverdue(t.due);
  const dueToday = !done && !t.daily && isDueToday(t.due);
  const critical = !done && isCritical(t);
  const sub = subProgress(t);

  const el = document.createElement('div');
  el.className = 'card task'
    + (featured ? ' task-hero' : '')
    + (done ? ' is-done' : '')
    + ((overdue || missed > 0) ? ' is-late' : '')
    + (critical ? ' is-critical' : '')
    + (' tier-' + tierOf(t).key);
  el.style.setProperty('--gc', goalColor(t.goalId));
  el.innerHTML = `
    <button class="check" data-id="${t.id}" aria-label="Toggle done">${done ? '✓' : ''}</button>
    <div class="task-body">
      <div class="task-head">
        <p class="task-title">${t.text}</p>
        <button class="del" data-del="${t.id}" aria-label="Delete task">×</button>
      </div>
      <div class="chips">
        <span class="chip chip-goal">${goal ? goal.name : 'No goal'}</span>
        <span class="chip chip-tier">${tierOf(t).label}</span>
        ${critical ? `<span class="chip chip-critical">critical \u00b7 ${tierOf(t).days}+ days behind</span>` : ''}
        ${!critical && isSlipping(t) ? '<span class="chip chip-slip">slipping</span>' : ''}
        ${overdue ? '<span class="chip chip-late">overdue</span>' : ''}
        ${dueToday ? '<span class="chip chip-today">due today</span>' : ''}
        ${t.daily ? '<span class="chip chip-daily">daily</span>' : ''}
        ${t.daily && missed > 0 ? `<span class="chip chip-late">missed ${missed}d in a row</span>` : ''}
        ${t.daily && missed === 0 && !done ? '<span class="chip chip-today">due today</span>' : ''}
        ${t.cal ? '<span class="chip chip-cal">calendar</span>' : ''}
        ${t.email ? '<span class="chip chip-mail">inbox</span>' : ''}
        ${t.daily
          ? ''
          : `<span class="chip chip-due"><input type="date" data-due="${t.id}" value="${t.due || ''}">${dueLabel ? ' · ' + dueLabel : ''}</span>`
        }
      </div>
      ${sub ? `
        <div class="subs">
          <div class="subs-head">
            <span>Milestones</span>
            <span class="subs-count">${sub.done}/${sub.total}</span>
          </div>
          <div class="subs-bar"><div class="subs-fill" style="width:${Math.round(sub.done/sub.total*100)}%"></div></div>
          <ul class="sub-list">
            ${t.subtasks.map(st => `
              <li class="sub-item${st.done ? ' sub-done' : ''}" data-sub="${st.id}">
                <span class="sub-box">${st.done ? '\u2713' : ''}</span>
                <span class="sub-text">${st.text}</span>
              </li>`).join('')}
          </ul>
        </div>` : ''}
    </div>
  `;
  return el;
}

function attachCardListeners(el, t){
  el.querySelector('.check').addEventListener('click', ()=>{
    if(t.daily){
      if(isDoneToday(t)) unmarkDailyDone(t); else markDailyDone(t);
    } else {
      t.done = !t.done;
    }
    scheduleSave(); render();
  });
  el.querySelector('[data-del]').addEventListener('click', ()=>{
    state.todos = state.todos.filter(x=>x.id!==t.id);
    scheduleSave(); render();
  });
  el.querySelectorAll('[data-sub]').forEach(li=>{
    li.addEventListener('click', ()=>{
      const st = (t.subtasks || []).find(x => x.id === li.dataset.sub);
      if(!st) return;
      st.done = !st.done;
      // Ticking a milestone counts as working on it today.
      if(st.done && t.daily) markDailyDone(t);
      scheduleSave(); render();
    });
  });

  const dueInp = el.querySelector('[data-due]');
  if(dueInp){
    dueInp.addEventListener('change', e=>{
      t.due = e.target.value || null;
      scheduleSave(); render();
    });
  }
}

function stakesFor(t){
  const missed = t.daily ? dailyMissedStreak(t) : 0;
  const tier = tierOf(t);
  if(missed >= tier.days) return `<b>${missed} days behind.</b> Past its ${tier.label} limit \u2014 clear it before anything else.`;
  if(missed > 0) return `<b>Skipped ${missed} day${missed===1?'':'s'}.</b> ${tier.days - missed} more and it goes critical.`;
  const sub = subProgress(t);
  if(sub && sub.done < sub.total) return `<b>Step ${sub.done + 1} of ${sub.total}:</b> ${sub.next}`;
  return 'Start here. Everything else waits.';
}

function renderTodos(){
  const mainWrap = document.getElementById('mainTaskWrap');
  const list = document.getElementById('todoList');
  const open = state.todos.filter(t=>!isTodoDone(t));
  const overdueCount = open.filter(t=>!t.daily && isOverdue(t.due)).length;
  const todayCount = open.filter(t=>!t.daily && isDueToday(t.due)).length;
  const missedDailyCount = open.filter(t=>t.daily && dailyMissedStreak(t) > 0).length;
  let countMsg = open.length
    ? `You have ${open.length} thing${open.length===1?'':'s'} open today.`
    : 'Everything on your list is done. Nice.';
  const flags = [];
  if(overdueCount) flags.push(`${overdueCount} overdue`);
  if(missedDailyCount) flags.push(`${missedDailyCount} daily behind`);
  if(todayCount) flags.push(`${todayCount} due today`);
  if(flags.length) countMsg += ' ' + flags.join(' · ') + '.';
  document.getElementById('countText').textContent = countMsg;

  const criticalCount = open.filter(t=>isCritical(t)).length;
  const doneCount = state.todos.length - open.length;
  const stats = [
    {num: open.length, lbl: 'Open', accent: 's-open'},
    {num: criticalCount, lbl: 'Critical', accent: 's-critical'},
    {num: overdueCount + missedDailyCount, lbl: 'Late', accent: 's-late'},
    {num: todayCount, lbl: 'Due today', accent: 's-today'},
    {num: doneCount, lbl: 'Done', accent: 's-done'},
  ];
  document.getElementById('statsStrip').innerHTML = stats.map(s=>`
    <div class="stat ${s.accent}">
      <span class="stat-num">${s.num}</span>
      <span class="stat-lbl">${s.lbl}</span>
    </div>
  `).join('');

  // ---- Main tasks: the core-tier work, featured above everything else ----
  const mainTasks = mainTasksNow();
  const mainIds = new Set(mainTasks.map(t => t.id));
  mainWrap.innerHTML = '';
  if(mainTasks.length){
    const label = document.createElement('div');
    label.className = 'hero-label';
    label.textContent = mainTasks.length > 1 ? 'Main tasks' : 'Main task';
    mainWrap.appendChild(label);
    mainTasks.forEach(t=>{
      const el = buildTodoEl(t, true);
      attachCardListeners(el, t);
      const stakes = document.createElement('div');
      stakes.className = 'stakes';
      stakes.innerHTML = stakesFor(t);
      el.querySelector('.task-body').appendChild(stakes);
      mainWrap.appendChild(el);
    });
  }

  let sorted = state.todos.filter(t => !mainIds.has(t.id));
  const doneRank = t => isTodoDone(t) ? 1 : 0;
  if(state.sort === 'score'){
    sorted.sort((a,b)=> (doneRank(a) - doneRank(b)) || (scoreOf(b)-scoreOf(a)));
  } else if(state.sort === 'due'){
    sorted.sort((a,b)=> (doneRank(a) - doneRank(b)) || ((a.due?new Date(a.due):Infinity) - (b.due?new Date(b.due):Infinity)));
  } else {
    sorted.sort((a,b)=> (doneRank(a) - doneRank(b)) || (goalById(a.goalId)?.name||'').localeCompare(goalById(b.goalId)?.name||''));
  }

  list.innerHTML = '';
  if(sorted.length === 0){
    list.innerHTML = '<div class="empty">Nothing here yet.</div>';
    return;
  }

  sorted.forEach(t=>{
    const el = buildTodoEl(t, false);
    attachCardListeners(el, t);
    list.appendChild(el);
  });
}

function ensureDailyDefaults(){
  // Self-heals tasks that got marked daily (e.g. via the console sync script)
  // without a createdDate/lastDoneDate — without this they'd default to
  // "not late," which is the right fallback anyway, but this keeps the
  // fields present so future edits don't have to check for undefined.
  state.todos.forEach(t=>{
    if(!t.daily) return;
    if(t.createdDate === undefined) t.createdDate = todayStr();
    if(t.lastDoneDate === undefined) t.lastDoneDate = null;
  });
}

function renderGreeting(){
  const now = new Date();
  const h = now.getHours();
  const word = h < 12 ? 'Good morning' : (h < 18 ? 'Good afternoon' : 'Good evening');
  document.getElementById('greeting').textContent = word + ', Aniket';
  document.getElementById('dateLine').textContent =
    now.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
}

function renderAccountability(){
  const prog = todayProgress();
  const debt = missedDebt();
  const criticalCount = state.todos.filter(t => !isTodoDone(t) && isCritical(t)).length;
  const ring = document.getElementById('progRing');
  ring.style.setProperty('--pct', prog.pct);
  ring.dataset.pct = prog.pct + '%';
  document.getElementById('progText').textContent = `${prog.done} of ${prog.total} daily tasks done`;

  const verdictEl = document.getElementById('verdict');
  let verdict, tone;
  if(prog.total && prog.done === prog.total){ verdict = 'Full clear today. This is the standard now.'; tone = 'good'; }
  else if(criticalCount){ verdict = `${criticalCount} task${criticalCount===1?'':'s'} past the critical line. Clear those first.`; tone = 'bad'; }
  else if(debt >= 6){ verdict = `${debt} missed days stacked up. Pick the main task and cut the debt.`; tone = 'bad'; }
  else if(debt > 0){ verdict = `${debt} missed day${debt===1?'':'s'} to claw back. Don't let it compound.`; tone = 'warn'; }
  else if(prog.done === 0){ verdict = 'Nothing done yet today. Start with the main task.'; tone = 'warn'; }
  else { verdict = 'On track. Keep going.'; tone = 'good'; }
  verdictEl.textContent = verdict;
  verdictEl.className = 'verdict ' + tone;

  document.getElementById('criticalVal').textContent = criticalCount;
  document.getElementById('debtVal').textContent = debt;
}

function render(){ ensureDailyDefaults(); renderGreeting(); renderAccountability(); renderGoals(); renderTodos(); }

document.getElementById('sortToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.sort = btn.dataset.sort;
  document.querySelectorAll('#sortToggle button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

// ---- MCP sync: calendar + email ----
async function callClaude(prompt, mcpServers){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:1000,
      messages:[{role:'user', content: prompt}],
      mcp_servers: mcpServers
    })
  });
  const data = await res.json();
  const toolResults = (data.content||[])
    .filter(b=>b.type==='mcp_tool_result')
    .map(b=>b.content?.[0]?.text || '').join('\n');
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return {toolResults, textBlocks, raw:data};
}

function setStatus(msg){ document.getElementById('statusText').textContent = msg; }

document.getElementById('calBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('calBtn');
  btn.disabled = true;
  setStatus('Reading calendar…');
  try{
    const todoLines = state.todos.filter(t=>!isTodoDone(t)).map(t=>`- ${t.text}`).join('\n');
    const {textBlocks} = await callClaude(
      `Look at my calendar events for the next 14 days. Here is my task list:\n${todoLines}\n\n` +
      `For each task that matches or relates to a calendar event, note the task and the event's date. ` +
      `Respond ONLY with a JSON array, no markdown fences, no prose. Each item: {"task":"<exact task text from the list above>","date":"YYYY-MM-DD"}. ` +
      `If nothing matches, respond with [].`,
      [{type:'url', url:'https://calendarmcp.googleapis.com/mcp/v1', name:'google-calendar'}]
    );
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    const matches = JSON.parse(clean || '[]');
    matches.forEach(m=>{
      const t = state.todos.find(x=>x.text === m.task);
      if(t){ t.cal = true; if(m.date && !t.due) t.due = m.date; }
    });
    btn.classList.add('on');
    setStatus(`Calendar synced · ${matches.length} task(s) matched to events`);
    scheduleSave(); render();
  }catch(e){
    console.error(e);
    setStatus('Calendar sync failed — check your connection in Settings');
  }
  btn.disabled = false;
});

document.getElementById('emlBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('emlBtn');
  btn.disabled = true;
  setStatus('Scanning inbox…');
  try{
    const todoLines = state.todos.filter(t=>!isTodoDone(t)).map(t=>`- ${t.text}`).join('\n');
    const {textBlocks} = await callClaude(
      `Check my recent and unread emails. Here is my task list:\n${todoLines}\n\n` +
      `For each task that a recent email relates to or is waiting on (a reply needed, a client message, an invite, etc), note it. ` +
      `Respond ONLY with a JSON array, no markdown fences, no prose. Each item: {"task":"<exact task text from the list above>"}. ` +
      `If nothing matches, respond with [].`,
      [{type:'url', url:'https://gmailmcp.googleapis.com/mcp/v1', name:'gmail'}]
    );
    const clean = textBlocks.replace(/```json|```/g,'').trim();
    const matches = JSON.parse(clean || '[]');
    matches.forEach(m=>{
      const t = state.todos.find(x=>x.text === m.task);
      if(t){ t.email = true; }
    });
    btn.classList.add('on');
    setStatus(`Inbox synced · ${matches.length} task(s) flagged from email`);

});

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
});

document.getElementById('installBtn').addEventListener('click', async ()=>{
  const hint = document.getElementById('installHint');
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const choice = await deferredInstallPrompt.userChoice.catch(()=>null);
    deferredInstallPrompt = null;
    if(choice && choice.outcome === 'accepted'){
      hint.classList.remove('show');
      return;
    }
  }
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const isWindows = /Windows/.test(ua);
  const isMac = /Macintosh|Mac OS/.test(ua) && !isIOS;
  const isEdge = /Edg\//.test(ua);
  const isChrome = /Chrome\//.test(ua) && !isEdge;
  let msg;
  if(isIOS){
    msg = 'Open this page in Safari, tap the Share icon, then "Add to Home Screen."';
  } else if(isAndroid){
    msg = 'Open this page in Chrome, tap the ⋮ menu, then "Add to Home screen" or "Install app."';
  } else if(isWindows || isMac){
    if(isEdge){
      msg = 'Click the install icon (⊕) at the right end of the address bar, or the "…" menu → Apps → "Install this site as an app."';
    } else if(isChrome){
      msg = 'Click the install icon (⊕) at the right end of the address bar, or the ⋮ menu → "Cast, save, and share" → "Install page as app."';
    } else {
      msg = 'This browser doesn\'t support one-click install. Open this page in Chrome or Edge for a native app-style window with an icon on your desktop/taskbar.';
    }
    if(location.protocol === 'file:'){
      msg += ' Note: installing works best when this page is hosted (not opened directly as a local file) — some browsers block install prompts for file:// pages.';
    }
  } else {
    msg = 'Open this page in Chrome or Edge, then use the menu option to install it as an app.';
  }
  hint.textContent = msg;
  hint.classList.add('show');
});

// ---- Daily reminder notifications ----
// Note: this is a static local page with no server/service worker, so reminders
// can only fire while this tab (or installed app window) is actually open —
// there's no true background/OS-level scheduling without hosting this with push support.
if(!state.reminders) state.reminders = {enabled:false, time:'10:00'};

const remindBtn = document.getElementById('remindBtn');
const remindPanel = document.getElementById('remindPanel');
const remindTime = document.getElementById('remindTime');

function syncReminderUI(){
  remindTime.value = state.reminders.time || '10:00';
  remindBtn.classList.toggle('on', state.reminders.enabled);
  remindBtn.textContent = 'Reminders: ' + (state.reminders.enabled ? 'on' : 'off');
  remindPanel.classList.toggle('show', state.reminders.enabled);
}

// The main task always leads. Everything else is a footnote to it.
function nudgeBody(){
  const mains = mainTasksNow();
  if(!mains.length) return 'Everything is done. Take the win.';
  let body = mains.map((t,i)=>{
    const missed = t.daily ? dailyMissedStreak(t) : 0;
    let line = (mains.length > 1 ? (i+1) + '. ' : '') + t.text;
    if(missed > 0) line += `  \u2014 skipped ${missed} day${missed===1?'':'s'} running`;
    const sub = subProgress(t);
    if(sub && sub.done < sub.total) line += `\n   next: ${sub.next}`;
    return line;
  }).join('\n');
  const mainIds = new Set(mains.map(t => t.id));
  const rest = state.todos
    .filter(t => !isTodoDone(t) && !mainIds.has(t.id))
    .sort((a,b) => scoreOf(b) - scoreOf(a))
    .slice(0,2);
  if(rest.length) body += '\n\nAfter that: ' + rest.map(t => t.text).join(' \u00b7 ');
  const debt = missedDebt();
  if(debt > 0) body += `\n${debt} missed day${debt===1?'':'s'} across your list.`;
  return body;
}

function topTasksSummary(){ return nudgeBody(); }

// Three escalating checkpoints a day. The later two only fire if the main task
// is STILL not done, and they get progressively harder to ignore.
const NUDGE_SLOTS = [
  {key:'am',  offset:0,  prefix:'Today: '},
  {key:'mid', offset:5,  prefix:'Still open: '},
  {key:'pm',  offset:11, prefix:'Last call: '}
];

function fireReminderNotification(slot){
  if(Notification.permission !== 'granted') return;
  const main = mainTaskNow();
  slot = slot || NUDGE_SLOTS[0];
  const mains = mainTasksNow();
  // Notification titles get truncated on most lock screens, so lead with one
  // task and count the rest. The full list is in the body.
  const title = mains.length
    ? slot.prefix + mains[0].text + (mains.length > 1 ? ` (+${mains.length - 1} more)` : '')
    : 'Signal Deck \u00b7 all clear';
  const n = new Notification(title, {
    body: nudgeBody(),
    requireInteraction: slot.offset > 0,
    icon: 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect width=\'100\' height=\'100\' rx=\'22\' fill=\'%23ffffff\'/%3E%3Crect x=\'22\' y=\'60\' width=\'12\' height=\'22\' rx=\'3\' fill=\'%230084FF\'/%3E%3Crect x=\'44\' y=\'44\' width=\'12\' height=\'38\' rx=\'3\' fill=\'%23FF801E\'/%3E%3Crect x=\'66\' y=\'28\' width=\'12\' height=\'54\' rx=\'3\' fill=\'%238B5CF6\'/%3E%3C/svg%3E',
    tag: 'signal-deck-' + slot.key
  });
  n.onclick = ()=>{ window.focus(); n.close(); };
}

function checkReminderTick(){
  if(!state.reminders.enabled || Notification.permission !== 'granted') return;
  const now = new Date();
  const [h, m] = (state.reminders.time || '10:00').split(':').map(Number);
  const today = todayStr();
  const main = mainTaskNow();

  NUDGE_SLOTS.forEach(slot=>{
    const slotHour = h + slot.offset;
    if(slotHour > 23) return;
    const stamp = 'signal-deck-nudge-' + slot.key;
    if(localStorage.getItem(stamp) === today) return;
    const reached = now.getHours() > slotHour || (now.getHours() === slotHour && now.getMinutes() >= m);
    if(!reached) return;
    // Follow-up nudges only exist to chase an unfinished main task.
    if(slot.offset > 0 && !main) return;
    fireReminderNotification(slot);
    localStorage.setItem(stamp, today);
  });
}

remindBtn.addEventListener('click', async ()=>{
  if(!('Notification' in window)){
    setStatus('Notifications aren\'t supported in this browser');
    return;
  }
  if(!state.reminders.enabled){
    let perm = Notification.permission;
    if(perm === 'default') perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      setStatus('Notifications blocked — enable them for this site in browser settings');
      return;
    }
    state.reminders.enabled = true;
    setStatus('Reminders on \u00b7 3 escalating nudges a day until the main task is done');
  } else {
    state.reminders.enabled = false;
    setStatus('Daily reminders off');
  }
  scheduleSave();
  syncReminderUI();
});

remindTime.addEventListener('change', e=>{
  state.reminders.time = e.target.value || '10:00';
  scheduleSave();
});

document.getElementById('testRemindBtn').addEventListener('click', async ()=>{
  if(!('Notification' in window)) return;
  let perm = Notification.permission;
  if(perm === 'default') perm = await Notification.requestPermission();
  if(perm === 'granted'){
    const main = mainTaskNow();
    const n = new Notification(main ? 'Today: ' + main.text : 'Signal Deck \u00b7 all clear', {
      body: nudgeBody(),
      tag: 'signal-deck-test'
    });
    n.onclick = ()=>{ window.focus(); n.close(); };
  } else {
    setStatus('Notifications blocked — enable them for this site in browser settings');
  }
});

setInterval(checkReminderTick, 60000);
// Daily tasks derive "done" from today's date, so if this tab stays open
// across midnight, re-render periodically to flip them back to open.
setInterval(render, 5 * 60000);

loadState().then(()=>{
  syncReminderUI();
  setStatus(storageWorking ? 'Saved on this device' : 'Not saving — check browser storage settings');
});
